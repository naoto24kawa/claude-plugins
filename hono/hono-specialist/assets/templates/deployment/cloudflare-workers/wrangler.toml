# Cloudflare Workers Configuration for Hono
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "hono-app"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Account ID (get from dashboard)
# account_id = "your-account-id"

# Workers AI
# [ai]
# binding = "AI"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hono-database"
database_id = "your-database-id"

# KV Namespace
[[kv_namespaces]]
binding = "CACHE"
id = "your-kv-id"
preview_id = "your-kv-preview-id"

# R2 Bucket
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hono-storage"
preview_bucket_name = "hono-storage-preview"

# Durable Objects
# [[durable_objects.bindings]]
# name = "COUNTER"
# class_name = "Counter"
# script_name = "counter"

# Environment variables (public)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

# Secrets (set with: wrangler secret put SECRET_NAME)
# JWT_SECRET = "xxx"
# API_KEY = "xxx"

# Custom domains
# routes = [
#   { pattern = "api.example.com", custom_domain = true }
# ]

# Node.js compatibility
# node_compat = true

# Deploy configuration
[build]
command = "npm run build"

[build.upload]
format = "service-worker"

# Development settings
[env.development]
vars = { ENVIRONMENT = "development" }

[env.development.d1_databases]
binding = "DB"
database_name = "hono-database-dev"
database_id = "your-dev-database-id"

# Staging settings
[env.staging]
vars = { ENVIRONMENT = "staging" }
